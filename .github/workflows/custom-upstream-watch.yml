# Custom: daily check for new upstream commits. Test-merges upstream master into `custom`
# (nothing is pushed) and opens/updates one issue, which GitHub emails you about.
# Requires Issues to be enabled on this fork (Settings > General > Features > Issues).
# Scheduled runs use the workflow file on the default branch, so `custom` must be the
# repository's default branch.
name: Custom - Watch upstream

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 6:17 AM Arizona time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: https://github.com/OpenSprinkler/OpenSprinkler-App.git
  UPSTREAM_NAME: OpenSprinkler/OpenSprinkler-App
  ISSUE_TITLE: "Upstream update available"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Compare with upstream and test-merge
        id: cmp
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream master
          up_sha=$(git rev-parse --short upstream/master)
          behind=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "up_sha=$up_sha" >> "$GITHUB_OUTPUT"
          echo "custom is $behind commit(s) behind upstream ($up_sha)"
          [ "$behind" -gt 0 ] || exit 0

          if git -c user.name=ci -c user.email=ci@localhost merge --no-commit --no-ff upstream/master >/dev/null 2>&1; then
            result="clean - safe to sync"
          else
            result="CONFLICTS - needs a manual merge"
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          git merge --abort 2>/dev/null || git reset --hard -q

          {
            echo "<!-- upstream:$up_sha -->"
            echo "Upstream \`$UPSTREAM_NAME\` master (\`$up_sha\`) has **$behind commit(s)** not in \`custom\`."
            echo
            echo "**Test merge into \`custom\`: $result**"
            if [ -n "$conflicts" ]; then
              echo
              echo "Conflicting files:"
              echo "$conflicts" | sed 's/^/- `/; s/$/`/'
            fi
            echo
            echo "### New upstream commits"
            git log --oneline --no-merges HEAD..upstream/master | head -40 | sed 's/^/- /'
            echo
            echo "### To update"
            echo "- If the merge is clean: Actions > **Custom - Sync from upstream** > Run workflow."
            echo "- Then the web UI redeploys to GitHub Pages automatically; on the Pi run \`~/update-opensprinkler-app.sh\`."
            echo "- This issue closes itself on the next check after \`custom\` is up to date."
          } > body.md
          cat body.md

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.cmp.outputs.behind }}
          UP_SHA: ${{ steps.cmp.outputs.up_sha }}
        run: |
          api="repos/$GITHUB_REPOSITORY/issues"
          num=$(gh api "$api?state=open&per_page=100" --jq "map(select(.title == \"$ISSUE_TITLE\" and (.pull_request|not))) | .[0].number // empty")
          if [ "$BEHIND" = "0" ]; then
            if [ -n "$num" ]; then
              gh api -X POST "$api/$num/comments" -f body="\`$GITHUB_REF_NAME\` is up to date with upstream (\`$UP_SHA\`)." >/dev/null
              gh api -X PATCH "$api/$num" -f state=closed >/dev/null
            fi
            exit 0
          fi
          if [ -z "$num" ]; then
            gh api -X POST "$api" -f title="$ISSUE_TITLE" -F body=@body.md --jq '.html_url'
          else
            old=$(gh api "$api/$num" --jq .body | grep -o 'upstream:[0-9a-f]*' | head -1)
            gh api -X PATCH "$api/$num" -F body=@body.md >/dev/null
            if [ "$old" != "upstream:$UP_SHA" ]; then
              gh api -X POST "$api/$num/comments" -f body="More upstream changes (now \`$UP_SHA\`); the description above is updated." >/dev/null
            fi
            echo "updated issue #$num"
          fi
